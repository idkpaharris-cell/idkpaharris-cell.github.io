<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Patrick Harris's personal site, with links to his background, resume, and portfolio.">
    <title>Patricks Informational Site</title>
     <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <a class="site-logo" href="index.html"><img src="logo.png" alt="Patrick Harris"></a>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about_me.html">About</a>
        <a href="resume.html">Resume</a>
        <a href="portfolio.html">Portfolio</a>
    </nav>
    <header class="page-header">
        <p class="eyebrow">Patrick Harris / Personal site</p>
        <h1>Welcome to my Personal Informational site!</h1>
    </header>
    <div class="three-sections">
        <section class="left-container">
            <dl>
                <dt><a href="about_me.html">About Me</a></dt>
                <dd>Learn more about me</dd>
            </dl>
        </section>
        <section class="center-container">
            <dl>
                <dt><a href="resume.html">Resume</a></dt>
                <dd>View my resume</dd>
            </dl>
        </section>
        <section class="right-container">
            <dl>
                <dt><a href="portfolio.html">Portfolio</a></dt>
                <dd>View my portfolio</dd>
            </dl>
        </section>
    </div>
    <section class="contact-section" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Get in touch</h2>
        <form id="contact-form" novalidate>
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" required>

            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" required>

            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>

            <p id="form-feedback" aria-live="polite"></p>
            <button type="submit">Send message</button>
        </form>
    </section>
    <script>
        document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("contact-name").value.trim();
            const email = document.getElementById("contact-email").value.trim();
            const message = document.getElementById("contact-message").value.trim();
            const missingFields = [];

            if (!name) {
                missingFields.push("name");
            }
            if (!email) {
                missingFields.push("email");
            }
            if (!message) {
                missingFields.push("message");
            }

            const feedback = document.getElementById("form-feedback");
            if (missingFields.length > 0) {
                feedback.textContent = "Please enter your " + missingFields.join(" and ") + ".";
            } else if (!document.getElementById("contact-email").checkValidity()) {
                feedback.textContent = "Please enter a valid email address.";
            } else {
                const subject = "Website message from " + name;
                const body = "Name: " + name + "\nEmail: " + email + "\n\n" + message;
                event.currentTarget.querySelector('button[type="submit"]').textContent = "Message ready to send";
                window.location.href = "mailto:idk.paharris@gmail.com?subject="
                    + encodeURIComponent(subject)
                    + "&body=" + encodeURIComponent(body);
            }
        });
    </script>
</body>
</html>
